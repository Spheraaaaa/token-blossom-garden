<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureNFT</title>
    <meta name="description" content="Discover and collect extraordinary NFTs from talented creators around the world" />
    <meta name="author" content="PureNFT" />
    <meta property="og:image" content="/og-image.png" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    
    <!-- Resource hints to improve loading performance -->
    <link rel="dns-prefetch" href="https://cdn.gpteng.co" />
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin />
    
    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    
    <!-- Load critical CSS inline to prevent render blocking -->
    <style>
      /* Critical CSS - expanded to prevent FOUC and layout shift */
      html { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        scroll-behavior: smooth;
      }
      body { 
        margin: 0; 
        line-height: 1.5; 
        background-color: #000;
        color: #fff;
        overflow-x: hidden;
      }
      #root { 
        min-height: 100vh; 
        display: flex;
        flex-direction: column;
      }
      /* Loading state to prevent layout shift */
      .loading { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        height: 100vh; 
        background: #000;
      }
      /* Critical layout styles */
      * { box-sizing: border-box; }
      button { cursor: pointer; }
      img { max-width: 100%; height: auto; }
      /* Prevent flash of unstyled content */
      .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
      .flex { display: flex; }
      .hidden { display: none; }
    </style>
    
    <!-- Fallback for CSS loading -->
    <noscript><link rel="stylesheet" href="/src/index.css"></noscript>
  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
