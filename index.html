<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureNFT</title>
    <meta name="description" content="Discover and collect extraordinary NFTs from talented creators around the world" />
    <meta name="author" content="PureNFT" />
    <meta property="og:image" content="/og-image.png" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    
    <!-- Resource hints to improve loading performance -->
    <link rel="dns-prefetch" href="https://cdn.gpteng.co" />
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin />
    
    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="preload" href="/src/index.css" as="style" />
    
    <!-- Load critical CSS inline to prevent render blocking -->
    <style>
      /* Critical CSS - minimal styles to prevent FOUC */
      html { font-family: system-ui, -apple-system, sans-serif; }
      body { margin: 0; line-height: 1.5; }
      #root { min-height: 100vh; }
      /* Loading state to prevent layout shift */
      .loading { display: flex; align-items: center; justify-content: center; height: 100vh; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
