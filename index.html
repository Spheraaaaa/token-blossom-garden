<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureNFT</title>
    <meta name="description" content="Discover and collect extraordinary NFTs from talented creators around the world" />
    <meta name="author" content="PureNFT" />
    <meta property="og:image" content="/og-image.png" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    
    <!-- Resource hints to improve loading performance -->
    <link rel="dns-prefetch" href="https://cdn.gpteng.co" />
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin />
    
    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/src/main.tsx" />
    
    <!-- Async CSS loading to prevent render blocking -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="stylesheet" href="/src/index.css" media="print" onload="this.media='all'">
    
    <!-- Load critical CSS inline to prevent render blocking -->
    <style>
      /* Critical CSS - comprehensive to prevent FOUC and layout shift */
      html { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        scroll-behavior: smooth;
        font-size: 16px;
      }
      body { 
        margin: 0; 
        line-height: 1.5; 
        background: #000;
        color: #fff;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { 
        min-height: 100vh; 
        display: flex;
        flex-direction: column;
        position: relative;
      }
      
      /* Critical layout and typography */
      *, *::before, *::after { 
        box-sizing: border-box; 
        margin: 0;
        padding: 0;
      }
      
      /* Essential button and interactive elements */
      button { 
        cursor: pointer; 
        border: none;
        background: transparent;
        font-family: inherit;
      }
      
      /* Image optimization */
      img { 
        max-width: 100%; 
        height: auto; 
        display: block;
      }
      
      /* Critical layout utilities */
      .container { 
        max-width: 1200px; 
        margin: 0 auto; 
        padding: 0 1rem; 
      }
      .flex { display: flex; }
      .grid { display: grid; }
      .hidden { display: none; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .fixed { position: fixed; }
      
      /* Critical spacing and sizing */
      .w-full { width: 100%; }
      .h-full { height: 100%; }
      .min-h-screen { min-height: 100vh; }
      
      /* Critical text styles */
      .text-center { text-align: center; }
      .font-bold { font-weight: 700; }
      .text-xl { font-size: 1.25rem; }
      .text-2xl { font-size: 1.5rem; }
      .text-3xl { font-size: 1.875rem; }
      
      /* Loading state to prevent layout shift */
      .loading { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        height: 100vh; 
        background: #000;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
      }
      
      /* Critical responsive utilities */
      @media (max-width: 640px) {
        .container { padding: 0 0.5rem; }
        html { font-size: 14px; }
      }
      
      /* Critical header/navigation styles */
      header { 
        position: fixed; 
        top: 0; 
        left: 0; 
        right: 0; 
        z-index: 50; 
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px);
      }
      
      /* Critical main content area */
      main { 
        flex: 1; 
        padding-top: 4rem; 
        position: relative;
      }
      
      /* Essential gradient backgrounds */
      .bg-gradient-radial { 
        background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%); 
      }
    </style>
    
    <!-- Fallback for CSS loading -->
    <noscript><link rel="stylesheet" href="/src/index.css"></noscript>
  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
